    - name: Upgrade local node configuration
      when: ansible_distribution == "Ubuntu"
      command: kubeadm upgrade node

    - name: Unhold kubelet package
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: kubelet
        selection: install

    - name: Upgrade kubelet package (Ubuntu)
      when: ansible_distribution == "Ubuntu"
      apt:
        name: "kubelet={{ k8s_version }}-*"
        state: present
        allow_downgrade: yes

    - name: Hold kubelet package
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: kubelet
