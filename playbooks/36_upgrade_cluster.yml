# PLAYBOOK CONFIG ----------------------------------------------------------------------------
- hosts: k8s_masters, worker_nodes
  become: true
  gather_facts: true
  
  # VAR PROMPTS ------------------------------------------------------------------------------

  # vars_prompt:
  #  - name: "var_name"
  #    prompt: "User prompt? change me..."
  #    private: no # should this be visible or hidden like a password
     
  # TASKS ------------------------------------------------------------------------------------
  tasks:

  # PRE-FLIGHT CHECKS ------------------------------------------------------------------------
  - name: Pre-flight check, fail if OS is not Ubuntu.
    when: ansible_distribution != "Ubuntu" and ansible_distribution != "RedHat"
    fail:
      msg: "This script is designed for Ubuntu"

  ############### UBUNTU SETUP SECTION ###############
# ==============================================================================
# PLAY 1: UPGRADE CONTROL PLANE (UBUNTU)
# ==============================================================================
- name: Upgrade Kubernetes Control Plane
  hosts: k8s_masters
  become: yes
  serial: 1 # Strictly upgrade one control plane node at a time
  tasks:
    - name: Cordon the control plane node
      when: ansible_distribution == "Ubuntu"
      command: kubectl cordon {{ inventory_hostname }} --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"

    - name: Drain the control plane node
      when: ansible_distribution == "Ubuntu"
      command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      ignore_errors: yes

    - name: Update Kubernetes APT repository for the new minor version
      when: ansible_distribution == "Ubuntu"
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"

    - name: Update APT cache
      when: ansible_distribution == "Ubuntu"
      apt:
        update_cache: yes

    - name: Unhold kubeadm package
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: kubeadm
        selection: install

    - name: Upgrade kubeadm package (Ubuntu)
      when: ansible_distribution == "Ubuntu"
      apt:
        name: "kubeadm={{ k8s_version }}-*"
        state: present
        allow_downgrade: yes

    - name: Hold kubeadm package
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: kubeadm
        selection: hold

    - name: Upload custom configuration (First Master ONLY)
      when: ansible_distribution == "Ubuntu"
      command: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-config-upgrade.yaml
      when: inventory_hostname == groups['k8s_masters'][0]

    - name: Apply kubeadm upgrade (First Master ONLY)
      when: ansible_distribution == "Ubuntu"
      command: kubeadm upgrade apply v{{ k8s_version }} -y
      when: inventory_hostname == groups['k8s_masters'][0]

    - name: Upgrade secondary control plane nodes (Other Masters)
      when: ansible_distribution == "Ubuntu"
      command: kubeadm upgrade node
      when: inventory_hostname != groups['k8s_masters'][0]

    - name: Unhold kubelet and kubectl packages
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubectl

    - name: Upgrade kubelet and kubectl packages (Ubuntu)
      when: ansible_distribution == "Ubuntu"
      apt:
        name: 
          - "kubelet={{ k8s_version }}-*"
          - "kubectl={{ k8s_version }}-*"
        state: present
        allow_downgrade: yes

    - name: Hold kubelet and kubectl packages
      when: ansible_distribution == "Ubuntu"
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubectl

    - name: Reload systemd daemon and restart kubelet
      when: ansible_distribution == "Ubuntu"
      systemd:
        daemon_reload: yes
        name: kubelet
        state: restarted

    - name: Uncordon the control plane node (With Wait Logic)
      when: ansible_distribution == "Ubuntu"
      command: kubectl uncordon {{ inventory_hostname }} --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      register: uncordon_result
      until: uncordon_result.rc == 0
      retries: 12
      delay: 5

    - name: Restart coredns to prevent dns resolving problem
      command: kubectl rollout restart deploy -n kube-system -l k8s-app=kube-dns --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      register: uncordon_result
      until: uncordon_result.rc == 0
      delay: 10
      retries: 3

    - name: Restart azure workload webhook deployment to prevent keyvault problem
      command: kubectl rollout restart deploy -n azure-workload-identity-system --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"
      register: uncordon_result
      until: uncordon_result.rc == 0
      delay: 10
      retries: 3

# ==============================================================================
# PLAY 2: UPGRADE WORKER NODES (UBUNTU)
# ==============================================================================
    - name: Cordon the worker node
      when: ansible_distribution == "Ubuntu"
      command: kubectl cordon {{ inventory_hostname }} --kubeconfig=/etc/kubernetes/admin.conf
      delegate_to: "{{ groups['k8s_masters'][0] }}"

    - name: Drain the worker node
