    - name: Reload systemd daemon and restart kubelet
      when: ansible_distribution == "Ubuntu"
      systemd:
        daemon_reload: yes
        name: kubelet
        state: restarted

    - name: Uncordon the worker node (With Wait Logic)
      when: ansible_distribution == "Ubuntu"
      command: kubectl uncordon {{ inventory_hostname }} --kubeconfig=/etc/kubernetes/admin.conf
